
<a class="pular-conteudo" href="#conteudo-principal">
  Pular para o conteúdo principal
</a>

<header class="topo">

  <a class="marca" routerLink="/" aria-label="PetShop, voltar ao início">
    PetShop
  </a>

  <div class="acesso-topo">

    @if (auth.estaLogado()) {
      <span class="usuario-atual">
        Olá, <strong>{{ auth.usuario()?.nome }}</strong>
      </span>

      <button type="button" class="botao-sair" (click)="auth.sair()">
        Sair
      </button>
    } @else {
      <a class="botao-entrar" routerLink="/login" routerLinkActive="ativo">
        Entrar
      </a>

      <a class="botao-cadastro" routerLink="/cadastro" routerLinkActive="ativo">
        Criar conta
      </a>
    }

  </div>

</header>

<div class="corpo">

  <nav class="menu" aria-label="Menu principal">

    <a
      routerLink="/"
      routerLinkActive="ativo"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Início
    </a>

    <a routerLink="/atendimentos" routerLinkActive="ativo">Atendimentos</a>
    <a routerLink="/pets" routerLinkActive="ativo">Pets</a>
    <a routerLink="/tutores" routerLinkActive="ativo">Tutores</a>
    <a routerLink="/produtos" routerLinkActive="ativo">Produtos</a>
    <a routerLink="/servicos" routerLinkActive="ativo">Serviços</a>
    <a routerLink="/profissionais" routerLinkActive="ativo">Profissionais</a>
    @if (auth.ehAdmin()) {
      <a routerLink="/relatorios" routerLinkActive="ativo">Relatórios </a>
    }

  </nav>

  <main id="conteudo-principal" class="conteudo" tabindex="-1">
    <router-outlet />
  </main>

</div>

<app-dialogo-confirmacao />
